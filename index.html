<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Equilibrium #3429 — an NFT preview card."
    />
    <title>Equilibrium #3429 | NFT Preview Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <main class="card">
        <a class="card__images" href="#" aria-label="View Equilibrium #3429">
          <img
            class="card__image"
            src="public/assets/equilibrium.svg"
            alt="A glowing geometric equilibrium cube"
          />
          <span class="card__images-layer" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <path
                d="M24 4 4 24l20 20 20-20L24 4Zm0 6.3L37.7 24 24 37.7 10.3 24 24 10.3Z"
                fill="currentColor"
              />
            </svg>
          </span>
        </a>

        <div class="card__title">
          <h1>Equilibrium #3429</h1>
        </div>
        <p class="card__description" id="info">Our Equilibrium collection promotes balance and calm.</p>

        <div class="card__time">
          <span class="card__time-left">
            <svg viewBox="0 0 11 18" aria-hidden="true">
              <path
                d="M5.5 0 0 9l5.5 3.2L11 9 5.5 0Zm0 18L0 10.4l5.5 3.2 5.5-3.2L5.5 18Z"
                fill="currentColor"
              />
            </svg>
            <span>0.041 ETH</span>
          </span>
          <span class="card__time-right">
            <svg viewBox="0 0 17 17" aria-hidden="true">
              <circle
                cx="8.5"
                cy="8.5"
                r="7.25"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M8.5 4.3v4.5l3 1.8"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="1.5"
              />
            </svg>
            <span>3 days left</span>
          </span>
        </div>

        <div class="card__creator">
          <img
            class="card__creator-image"
            src="public/assets/creator-avatar.svg"
            alt="Portrait of Ketan Makode"
          />
          <p>
            Creation of
            <a
              href="https://github.com/KetanMakode"
              target="_blank"
              rel="noopener noreferrer"
            >
              Ketan Makode
            </a>
          </p>
        </div>
      </main>

      <footer class="attribution">
        <span>
          Challenge by
          <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">
            Crio
          </a>.
        </span>
        <span>
          Coded by
          <a
            href="https://www.github.com/luktumun"
            target="_blank"
            rel="noopener noreferrer"
          >
            Ketan Makode
          </a>.
        </span>
      </footer>
    </div>
  </body>
</html>
